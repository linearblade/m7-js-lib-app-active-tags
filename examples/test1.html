<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m7 Active Tags test page</title>
    <link rel="stylesheet" href="style.css">
    <!--
	<script src="https://js.m7.org/gs/v1/bootStrap.js"></script>
	<script src="https://js.m7.org/activeTags/v.0.9.8/atLib.js"></script>
	-->
	<script type="module" >
	  import lib from "/vendor/m7-js-lib/src/index.js";
	  
	  window.lib = lib;
	</script>
	<script type="module"  src="/vendor/m7-js-lib-tree/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-workspace/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-primitive-log/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-interval/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-str-interp/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-primitive-dom-eventdelegator/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-primitive-dom-changeobserver/src/auto.js"></script>
	<script type="module"  src="/vendor/m7-js-lib-site-form/src/auto.js"></script>
	<script type="module">
	  import ActiveTags from '/vendor/m7-js-lib-active-tags/src/ActiveTags.js';
	  window.ActiveTags = ActiveTags;
	  lib.bool.xTrue = lib.bool.intentTrue;
	  lib.bool.xFalse = lib.bool.intentFalse;
	  lib.service.set('activeTags', new ActiveTags(lib,{intervalOn : false, eventOn:true}) );
	  window.AT = lib.service.get('activeTags');
	</script>
  </head>
  <body>
    <div style="display:flex; flex-direction:row; width:100%">
      begginning the long climb for AT remake
    </div>

    <div data-activetag data-enable-enabled="no">
      this is a test
    </div>
    <div data-somethingelse>
      this is a non active tag
    </div>

    <!-- Drop this anywhere in <body> to test Job._configureReadDomInputs() -->
    <form id="at-demo-form"
	  name="demoForm"
	  action="/api/demo/submit"
	  method="POST"
	  enctype="multipart/form-data"
	  data-confirm="are you sure?"
	  data-activetag="1"
	  data-at="find:.config"
	  data-config-at="find:.config"

	  data-request-url="/api/demo/submit"
	  data-request-method="post"
	  data-request-headers-accept="application/json"
	  data-request-headers-x-test="Hello"
	  data-request-body-mode="json"
	  data-request-timeout-ms="8000"
	  data-request-retry-max="3"
	  data-request-retry-backoff-ms="250"

	  data-response-json="true"
	  data-response-src="request:jsonData"
	  data-response-target="#at-demo-out"
	  data-response-mode="replace"

	  data-pre-src="this:innerHTML"
	  data-pre-transform="trim"
	  data-post-src="this:innerHTML"
	  data-post-transform="sanitize"

	  ddata-pipeline-pre="validate normalize"
	  ddata-pipeline-post="render notify"

	  ddata-interval-main-every-ms="15000"
	  ddata-interval-main-max-runs="5"
	  ddata-interval-main-overlap-policy="coalesce"

	  data-stack-main="request response"
	  data-stack-main-0="request"
	  data-stack-main-1="response"
	  data-stack-onload="main"
	  data-stack-onsubmit="main"

	  data-debug="1"
	  data-flags-enabled="true">
      <script type="application/json" class="config">
	{
	    "name": "test-job",

	    "enable": {
		"enabled": true,
		"autorun": true
	    },


	    "events": {
		"hover:on" : {
		    "enabled" : true,
		    "event": "pointerover",
		    "selector": "[data-button]",
		    "pipeline": "hover_on",
		    "options": { "capture": false, "passive": true }
		},
		"hover:off" : {
		    "event": "pointerout",
		    "selector": "[data-button]",
		    "pipeline": "hover_off",
		    "options": { "capture": false, "passive": true }
		}
	    },
	    
	    "request_shape": {
		"headers": {
		    "X-Test": "yes"
		}
	    },

	    "request": "/api/test/default",

	    "requests": {
		"delete": {
		    "url": "/api/test/delete",
		    "method": "post"
		}
	    },

	    "interval_shape": {
		"repeat": 7000,
		"allowOverlap": false
	    },

	    "interval": {
		"pipeline" : "interval"
	    },

	    "intervals": {
		"poll": {
		    "pipeline" : "interval2",
		    "repeat": 2000,
		    "allowOverlap": false
		}
	    },

	    "pipeline_shape": {
		"confirm": true
	    },

	    "pipeline": {
		"run": "foo:1,2,3 bar:${a},${b} far",
		"onError" : "errOutput:whoopsie"
	    },
	    
	"pipelines": {
	"patch" :{
	    "run": ["confirm", "form.submit", "form.collect", {"op": "dom.patch", "args" : {"style.font-weight": "bold",	"style.color"      : "red"} }, "http.send" , "foo"],
	"onError": "errOutput"
	},
		"hover_on": {
		    "run": "hover_on hover_b",
		    "onError": "errOutput"
		},
		
		"hover_off": {
		    "run": "hover_off",
		    "onError": "errOutput"
		}
	    }
	}
      </script>
      <label>
	Email:
	<input name="email" type="email" value="test@example.com" />
      </label>

      <button type="submit" data-button>Submit</button>
    </form>

    <div id="at-demo-out">Output target</div>
    
    </body>

    <script>
      function foo(...args){
	  console.log('calling foo',...args);
	  //throw new Error("asdad");
	  return true;
      }
      function bar(...args){
	  console.log('calling bar',...args);
	  return false;
      }
      function errOutput(...args){
	  console.log('got an error',...args);
	  return false;
      }
      function far(){
	  console.log('end of line');
	  return true;
      }

      async function hover_on(input) {
	  const job = input.job;
	  console.warn('hover on!',input);
	  input.ctx.test='foo';

	  if (!job || !job.e) return false;

	  const el = job.e;

	  el.style.outline = '2px solid red';
	  el.style.outlineOffset = '2px';

	  return true;
      }
      function hover_b(input){
	  console.warn('hover b',input);
	  return true;
      }
      async function hover_off({ job }) {
	  console.warn('hover off!');
	  if (!job || !job.e) return false;

	  const el = job.e;

	  el.style.outline = '';
	  el.style.outlineOffset = '';

	  return true;
      }
    </script>
</html>
