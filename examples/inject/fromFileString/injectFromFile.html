<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/vendor/m7-js-lib-active-tags/favicon.jpg">
    <title>ActiveTags Inject From File Example (String Pipelines)</title>
    <link rel="stylesheet" href="injectFromFile.css">
    <script type="module" src="./injectFromFile.js"></script>
  </head>
  <body>
    <main class="inject-page">
      <h1 class="inject-title">Inject Local File Into Active Tag (String Pipelines)</h1>
      <p class="inject-copy">
        Click a button to fetch a fragment file from this directory and inject it into the active tag content slot.
      </p>

      <div
        data-activetag
        at-name="inject-from-file-string"
        at-at="import:inject-file.js"
        class="inject-host">
        <div class="inject-actions">
          <button id="loadOriginal" type="button" class="inject-btn">original</button>
          <button id="loadNew" type="button" class="inject-btn inject-btn-alt">new</button>
        </div>
        <div class="inject-content">injected content appears here.</div>
      </div>
    </main>
  </body>
</html>
